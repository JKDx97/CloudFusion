[package]
name = "cloudfusion-node"
version = "0.1.0"
description = "Headless CloudFusion device pairing and management CLI"
edition = "2021"
rust-version = "1.88"

[dependencies]
base64 = "0.22"
libp2p = { version = "0.57.0", default-features = false, features = ["ed25519"] }
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4", "serde"] }
