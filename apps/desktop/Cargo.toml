[package]
name = "cloudfusion-desktop"
version = "0.1.0"
description = "CloudFusion desktop client"
authors = ["CloudFusion"]
edition = "2021"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
futures = "0.3"
keyring = "4.2.0"
libp2p = { version = "0.57.0", default-features = false, features = ["ed25519", "macros", "mdns", "noise", "quic", "tokio", "yamux"] }
notify = "8.2.0"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.10.3", features = [] }
tokio = { version = "1", features = ["macros", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
