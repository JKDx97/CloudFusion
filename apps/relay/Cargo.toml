[package]
name = "cloudfusion-relay"
version = "0.1.0"
description = "Allowlisted Circuit Relay v2 service for CloudFusion devices"
edition = "2021"
rust-version = "1.88"

[dependencies]
futures = "0.3"
libp2p = { version = "0.57.0", default-features = false, features = ["ed25519", "identify", "macros", "noise", "quic", "relay", "tcp", "tokio", "yamux"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
